[package]
name = "clodex"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Clodex coding agent and resumable language-model training runtime"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[build-dependencies]
cc = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
